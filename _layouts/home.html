---
layout: default
---
<div class="container writing-page">
  <header class="page-header">
    <h1>Writing</h1>
    <p class="page-description">{{ site.description }}</p>
  </header>
  {%- if site.posts.size > 0 -%}
  <div class="post-grid">
    {%- for post in site.posts -%}
      {%- include post-card.html post=post -%}
    {%- endfor -%}
  </div>
  {%- endif -%}
</div>
