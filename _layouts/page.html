---
layout: default
---
<div class="container page-container">
  <header class="page-header">
    <h1>{{ page.title | escape }}</h1>
    {%- if page.description -%}
      <p class="page-description">{{ page.description | escape }}</p>
    {%- endif -%}
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</div>
