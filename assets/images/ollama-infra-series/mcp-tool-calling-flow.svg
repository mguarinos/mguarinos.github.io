<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#12101c"/>
    </linearGradient>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#da7b55"/>
    </marker>
    <marker id="ay" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e6b84c"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#8b5cf6" stroke-opacity="0.025" stroke-width="0.5">
    <line x1="0" y1="125" x2="900" y2="125"/>
    <line x1="0" y1="250" x2="900" y2="250"/>
    <line x1="0" y1="375" x2="900" y2="375"/>
    <line x1="225" y1="0" x2="225" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="675" y1="0" x2="675" y2="500"/>
  </g>

  <!-- ── ACTOR BOXES ── -->

  <!-- Claude Code: cx=95 -->
  <rect x="18" y="22" width="154" height="72" rx="9" fill="#161b22" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="95" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="13" font-weight="700" fill="#8b5cf6" text-anchor="middle">Claude Code</text>
  <line x1="32" y1="58" x2="158" y2="58" stroke="#21262d" stroke-width="0.8"/>
  <text x="95" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#8b949e" text-anchor="middle">CLI · tool orchestrator</text>
  <text x="95" y="87" font-family="'SF Mono','Fira Code',monospace"
    font-size="8" fill="#444d56" text-anchor="middle">your terminal</text>

  <!-- Anthropic API: cx=320 -->
  <rect x="243" y="22" width="154" height="72" rx="9" fill="#161b22" stroke="#da7b55" stroke-width="1.5"/>
  <text x="320" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="13" font-weight="700" fill="#da7b55" text-anchor="middle">Anthropic API</text>
  <line x1="257" y1="58" x2="383" y2="58" stroke="#21262d" stroke-width="0.8"/>
  <text x="320" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#8b949e" text-anchor="middle">Claude · reasoning</text>
  <text x="320" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="8" fill="#444d56" text-anchor="middle">decides which tool to call</text>

  <!-- MCP Server: cx=580 -->
  <rect x="503" y="22" width="154" height="72" rx="9" fill="#161b22" stroke="#e6b84c" stroke-width="1.5"/>
  <text x="580" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="13" font-weight="700" fill="#e6b84c" text-anchor="middle">MCP Server</text>
  <line x1="517" y1="58" x2="643" y2="58" stroke="#21262d" stroke-width="0.8"/>
  <text x="580" y="74" font-family="'SF Mono','Fira Code',monospace"
    font-size="8" fill="#8b949e" text-anchor="middle">ollama-mcp-server.mjs</text>
  <text x="580" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="8" fill="#444d56" text-anchor="middle">stdio transport</text>

  <!-- Ollama: cx=810 -->
  <rect x="733" y="22" width="149" height="72" rx="9" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="807" y="50" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="13" font-weight="700" fill="#58a6ff" text-anchor="middle">Ollama</text>
  <line x1="747" y1="58" x2="869" y2="58" stroke="#21262d" stroke-width="0.8"/>
  <text x="807" y="74" font-family="'SF Mono','Fira Code',monospace"
    font-size="9" fill="#8b949e" text-anchor="middle">127.0.0.1:11434</text>
  <text x="807" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="8" fill="#444d56" text-anchor="middle">local inference</text>

  <!-- ── LIFELINES ── -->
  <line x1="95"  y1="94"  x2="95"  y2="460" stroke="#8b5cf6" stroke-width="1"   stroke-dasharray="5,4" opacity="0.25"/>
  <line x1="320" y1="94"  x2="320" y2="460" stroke="#da7b55" stroke-width="1"   stroke-dasharray="5,4" opacity="0.25"/>
  <line x1="580" y1="94"  x2="580" y2="460" stroke="#e6b84c" stroke-width="1"   stroke-dasharray="5,4" opacity="0.25"/>
  <line x1="807" y1="94"  x2="807" y2="460" stroke="#58a6ff" stroke-width="1"   stroke-dasharray="5,4" opacity="0.25"/>

  <!-- ── ACTIVATION BARS (show when active) ── -->
  <rect x="88"  y="145" width="14" height="260" rx="3" fill="#8b5cf6" opacity="0.15"/>
  <rect x="313" y="145" width="14" height="100" rx="3" fill="#da7b55" opacity="0.15"/>
  <rect x="573" y="270" width="14" height="135" rx="3" fill="#e6b84c" opacity="0.15"/>
  <rect x="800" y="320" width="14" height="60"  rx="3" fill="#58a6ff" opacity="0.15"/>

  <!-- ── MESSAGE ARROWS ── -->

  <!-- ① Claude Code → Anthropic: prompt + tool definitions -->
  <line x1="103" y1="160" x2="311" y2="160" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="207" y="153" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#8b5cf6" text-anchor="middle">① prompt + tool definitions</text>

  <!-- ② Anthropic → Claude Code: tool_use -->
  <line x1="311" y1="210" x2="103" y2="210" stroke="#da7b55" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ao)"/>
  <text x="207" y="203" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#da7b55" text-anchor="middle">② tool_use: ollama_generate(model, prompt)</text>

  <!-- ③ Claude Code → MCP Server: stdio invoke -->
  <line x1="103" y1="270" x2="571" y2="270" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#ap)"/>
  <text x="337" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#8b5cf6" text-anchor="middle">③ stdio: call ollama_generate</text>

  <!-- ④ MCP Server → Ollama: POST /api/generate -->
  <line x1="588" y1="325" x2="798" y2="325" stroke="#e6b84c" stroke-width="1.5" marker-end="url(#ay)"/>
  <text x="693" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#e6b84c" text-anchor="middle">④ POST /api/generate</text>

  <!-- ⑤ Ollama → MCP Server: generated text -->
  <line x1="798" y1="370" x2="588" y2="370" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ab)"/>
  <text x="693" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#58a6ff" text-anchor="middle">⑤ {response, eval_count, …}</text>

  <!-- ⑥ MCP Server → Claude Code: tool_result -->
  <line x1="571" y1="415" x2="103" y2="415" stroke="#e6b84c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ay)"/>
  <text x="337" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#e6b84c" text-anchor="middle">⑥ tool_result: generated text</text>

  <!-- ── STEP NUMBERS ON LIFELINE DOTS ── -->
  <circle cx="95"  cy="160" r="4" fill="#8b5cf6"/>
  <circle cx="320" cy="160" r="4" fill="#8b5cf6"/>
  <circle cx="320" cy="210" r="4" fill="#da7b55"/>
  <circle cx="95"  cy="210" r="4" fill="#da7b55"/>
  <circle cx="95"  cy="270" r="4" fill="#8b5cf6"/>
  <circle cx="580" cy="270" r="4" fill="#8b5cf6"/>
  <circle cx="580" cy="325" r="4" fill="#e6b84c"/>
  <circle cx="807" cy="325" r="4" fill="#e6b84c"/>
  <circle cx="807" cy="370" r="4" fill="#58a6ff"/>
  <circle cx="580" cy="370" r="4" fill="#58a6ff"/>
  <circle cx="580" cy="415" r="4" fill="#e6b84c"/>
  <circle cx="95"  cy="415" r="4" fill="#e6b84c"/>

  <!-- ── TITLE ── -->
  <text x="450" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="13" font-weight="700" fill="#c9d1d9" text-anchor="middle">MCP tool calling flow — Claude Code invoking Ollama</text>
</svg>
