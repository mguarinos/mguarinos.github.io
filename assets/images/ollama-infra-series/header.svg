<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900" height="506">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <radialGradient id="bloom" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vdiv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#6366f1" opacity="0.08"/>
    </pattern>
    <filter id="cs" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="900" height="506" fill="url(#bg)"/>
  <rect width="900" height="506" fill="url(#bloom)"/>
  <rect x="440" y="0" width="460" height="506" fill="url(#dots)"/>

  <!-- Subtle grid on left -->
  <g stroke="#7c3aed" stroke-opacity="0.035" stroke-width="0.5">
    <line x1="0" y1="126" x2="440" y2="126"/>
    <line x1="0" y1="252" x2="440" y2="252"/>
    <line x1="0" y1="378" x2="440" y2="378"/>
    <line x1="110" y1="0" x2="110" y2="506"/>
    <line x1="220" y1="0" x2="220" y2="506"/>
    <line x1="330" y1="0" x2="330" y2="506"/>
  </g>

  <!-- Vertical divider -->
  <line x1="440" y1="0" x2="440" y2="506" stroke="url(#vdiv)" stroke-width="1"/>

  <!-- ══════════════════════════════════════
       LEFT — TYPOGRAPHIC HERO
  ══════════════════════════════════════ -->

  <!-- Series badge -->
  <rect x="54" y="64" width="104" height="22" rx="11" fill="#f3f0ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="106" y="79" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="8" fill="#7c3aed" letter-spacing="2.5">INFRA SERIES</text>

  <!-- Self-hosting -->
  <text x="54" y="152"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="34" font-weight="300" fill="#64748b" letter-spacing="-0.5">Self-hosted AI Inference with</text>

  <!-- Ollama hero -->
  <text x="50" y="248"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="82" font-weight="800" fill="#7c3aed" letter-spacing="-3">Ollama</text>

  <!-- Decorative underline -->
  <rect x="52" y="261" width="312" height="3" rx="1.5" fill="#7c3aed" opacity="0.2"/>

  <!-- Subtitle -->
  <text x="54" y="290"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="13.5" fill="#64748b">Local AI infrastructure,</text>
  <text x="54" y="309"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="13.5" fill="#64748b">from scratch to production</text>

