  <!-- ── Step 6: WebUI Extensions (violet) y=337 ── -->
  <rect x="548" y="318" width="310" height="38" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cs)"/>
  <circle cx="522" cy="337" r="12" fill="white" stroke="#8b5cf6" stroke-width="2"/>
  <text x="522" y="342" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="10" font-weight="700" fill="#8b5cf6">6</text>
  <text x="566" y="334"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
