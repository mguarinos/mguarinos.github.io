  <rect x="184" y="334" width="84" height="22" rx="11" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="226" y="349" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
