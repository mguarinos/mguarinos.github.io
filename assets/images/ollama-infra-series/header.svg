  <text x="566" y="349"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="9" fill="#94a3b8">tools · functions · pipelines · custom models</text>

  <!-- ── Step 7: Claude Code MCP (indigo) y=394 ── -->
  <rect x="548" y="375" width="310" height="38" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cs)"/>
  <circle cx="522" cy="394" r="12" fill="white" stroke="#6366f1" stroke-width="2"/>
  <text x="522" y="399" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="10" font-weight="700" fill="#6366f1">7</text>
  <text x="566" y="391"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="12" font-weight="600" fill="#0f172a">Claude Code MCP</text>
  <text x="566" y="406"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
