  <rect x="548" y="90" width="310" height="38" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cs)"/>
  <circle cx="522" cy="109" r="12" fill="white" stroke="#3b82f6" stroke-width="2"/>
  <text x="522" y="114" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
