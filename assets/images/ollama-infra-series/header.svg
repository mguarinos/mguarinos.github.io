  <text x="80" y="349" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="8" fill="#2563eb">nginx</text>

  <rect x="114" y="334" width="62" height="22" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
