    stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,5"/>

  <!-- ── Step 1: From Zero (purple) y=52 ── -->
  <rect x="548" y="33" width="310" height="38" rx="7" fill="white" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cs)"/>
  <circle cx="522" cy="52" r="12" fill="white" stroke="#7c3aed" stroke-width="2"/>
  <text x="522" y="57" text-anchor="middle"
