  <text x="538" y="32" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Branch per environment</text>
  <rect x="462" y="42" width="136" height="20" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="530" y="56" font-size="9.5" fill="#b45309" text-anchor="middle">⚠ drift-prone</text>

  <!-- three branch cards -->
  <rect x="400" y="90" width="260" height="40" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="400" y="90" width="6" height="40" rx="3" fill="#2563eb"/>
  <text x="420" y="108" class="mono" font-size="10.5" fill="#1e40af">branch: dev</text>
  <text x="420" y="123" class="mono" font-size="9" fill="#9ca3af">full manifest copy</text>

  <rect x="400" y="140" width="260" height="40" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="400" y="140" width="6" height="40" rx="3" fill="#7c3aed"/>
  <text x="420" y="158" class="mono" font-size="10.5" fill="#6d28d9">branch: staging</text>
  <text x="420" y="173" class="mono" font-size="9" fill="#9ca3af">full manifest copy · already diverged</text>

  <rect x="400" y="190" width="260" height="40" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="400" y="190" width="6" height="40" rx="3" fill="#dc2626"/>
  <text x="420" y="208" class="mono" font-size="10.5" fill="#b91c1c">branch: prod</text>
  <text x="420" y="223" class="mono" font-size="9" fill="#9ca3af">full manifest copy · drifts further</text>

  <text x="530" y="256" font-size="9.5" fill="#6b7280" text-anchor="middle">Promote = merge between branches;</text>
  <text x="530" y="270" font-size="9.5" fill="#6b7280" text-anchor="middle">env-specific edits cause merge conflicts</text>
  <text x="530" y="290" font-size="9.5" fill="#b45309" text-anchor="middle">branches silently diverge over time</text>
</svg>
