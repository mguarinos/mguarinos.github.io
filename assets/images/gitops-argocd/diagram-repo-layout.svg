  <text x="178" y="32" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">Directory per environment</text>
  <rect x="100" y="42" width="140" height="20" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="170" y="56" font-size="9.5" fill="#15803d" text-anchor="middle">✓ recommended</text>

  <!-- branch chip -->
  <rect x="40" y="78" width="80" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="80" y="93" font-size="9.5" fill="#1e40af" text-anchor="middle">branch: main</text>

  <!-- tree card -->
  <rect x="40" y="112" width="260" height="150" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="56" y="134" class="mono" font-size="10.5" fill="#6b7280">base/</text>
  <text x="70" y="151" class="mono" font-size="10.5" fill="#9ca3af">deployment.yaml · service.yaml</text>
  <text x="56" y="174" class="mono" font-size="10.5" fill="#374151">overlays/</text>
  <text x="70" y="192" class="mono" font-size="10.5" fill="#2563eb">dev/        </text><text x="156" y="192" class="mono" font-size="10.5" fill="#9ca3af">kustomization.yaml</text>
  <text x="70" y="210" class="mono" font-size="10.5" fill="#2563eb">staging/    </text><text x="156" y="210" class="mono" font-size="10.5" fill="#9ca3af">kustomization.yaml</text>
  <text x="70" y="228" class="mono" font-size="10.5" fill="#2563eb">prod/       </text><text x="156" y="228" class="mono" font-size="10.5" fill="#9ca3af">kustomization.yaml</text>
  <text x="56" y="250" class="mono" font-size="9.5" fill="#16a34a">one source of truth · no divergence</text>

  <text x="170" y="284" font-size="9.5" fill="#6b7280" text-anchor="middle">Promote = PR that edits an image tag</text>
  <text x="170" y="298" font-size="9.5" fill="#6b7280" text-anchor="middle">in one overlay — the full diff is visible</text>

  <!-- ===== RIGHT: branches ===== -->
