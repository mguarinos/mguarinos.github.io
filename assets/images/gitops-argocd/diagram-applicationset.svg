<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <style>text { font-family: Inter, system-ui, sans-serif; }</style>
  <defs>
    <marker id="as" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="#f8f9fa"/>

  <!-- ApplicationSet + generator -->
  <rect x="30" y="95" width="180" height="110" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
  <text x="120" y="120" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">ApplicationSet</text>
  <line x1="46" y1="130" x2="194" y2="130" stroke="#fed7aa" stroke-width="1"/>
  <text x="120" y="148" font-size="10" fill="#b45309" text-anchor="middle">generator: list</text>
  <text x="120" y="166" font-size="9.5" fill="#6b7280" text-anchor="middle">dev · staging · prod</text>
  <text x="120" y="184" font-size="9" fill="#9ca3af" text-anchor="middle">one template,</text>
  <text x="120" y="196" font-size="9" fill="#9ca3af" text-anchor="middle">parameterised per item</text>

  <!-- generated Applications -->
  <!-- dev -->
  <rect x="360" y="34" width="150" height="52" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="435" y="55" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">Application: dev</text>
  <text x="435" y="72" font-size="9" fill="#6b7280" text-anchor="middle">→ cluster dev-eu</text>

  <!-- staging -->
  <rect x="360" y="124" width="150" height="52" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="435" y="145" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">Application: staging</text>
  <text x="435" y="162" font-size="9" fill="#6b7280" text-anchor="middle">→ cluster stg-eu</text>

  <!-- prod -->
  <rect x="360" y="214" width="150" height="52" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="435" y="235" font-size="11" font-weight="500" fill="#374151" text-anchor="middle">Application: prod</text>
  <text x="435" y="252" font-size="9" fill="#6b7280" text-anchor="middle">→ cluster prod-eu</text>

  <!-- fan-out arrows -->
  <path d="M210,135 C280,120 300,70 358,60" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#as)"/>
  <line x1="210" y1="150" x2="358" y2="150" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#as)"/>
  <path d="M210,165 C280,180 300,230 358,240" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#as)"/>

  <!-- target clusters -->
  <rect x="560" y="42" width="110" height="36" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="615" y="64" font-size="10" fill="#1e40af" text-anchor="middle">dev cluster</text>
  <rect x="560" y="132" width="110" height="36" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="615" y="154" font-size="10" fill="#1e40af" text-anchor="middle">staging cluster</text>
  <rect x="560" y="222" width="110" height="36" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="615" y="244" font-size="10" fill="#1e40af" text-anchor="middle">prod cluster</text>

  <line x1="510" y1="60" x2="558" y2="60" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#as)"/>
  <line x1="510" y1="150" x2="558" y2="150" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#as)"/>
  <line x1="510" y1="240" x2="558" y2="240" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#as)"/>

  <text x="284" y="290" font-size="9" fill="#9ca3af" text-anchor="middle">add an item to the generator → a new Application appears automatically</text>
</svg>
