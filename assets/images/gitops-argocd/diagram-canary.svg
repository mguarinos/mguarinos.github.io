<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320">
  <style>text { font-family: Inter, system-ui, sans-serif; }</style>
  <defs>
    <marker id="cg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9ca3af"/>
    </marker>
    <marker id="cg-grn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#16a34a"/>
    </marker>
    <marker id="cg-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#f8f9fa"/>

  <!-- content shifted +20 to balance left/right margins -->
  <g transform="translate(20,0)">

  <!-- Prometheus -->
  <rect x="280" y="20" width="140" height="40" rx="6" fill="#fff5f0" stroke="#e6522c" stroke-width="1.5"/>
  <svg x="296" y="29" width="22" height="22" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><path d="M63.66 2.477c33.477.007 60.957 27.296 60.914 60.5-.043 33.703-27.41 60.617-61.613 60.593-33.441-.023-60.477-27.343-60.453-61.086C2.53 29.488 30.066 2.47 63.66 2.477zm-18.504 21.25c.766 3.777.024 7.3-1.113 10.765-.785 2.399-1.871 4.711-2.52 7.145-1.07 4.008-2.28 8.039-2.726 12.136-.64 5.895 1.676 11.086 5.64 16.25l-18.222-3.835c.031.574 0 .792.062.976 1.727 5.074 4.766 9.348 8.172 13.379.36.426 1.18.644 1.79.644 18.167.036 36.335.032 54.503.008.563 0 1.317-.105 1.66-.468 3.895-4.094 6.871-8.758 8.735-14.63l-19.29 3.778c1.274-2.496 2.723-4.688 3.56-7.098 2.855-8.242 1.671-16.21-2.427-23.726-3.289-6.031-6.324-12.035-4.683-19.305-3.473 3.434-4.809 7.8-5.656 12.3-.832 4.434-1.325 8.93-1.97 13.43-.093-.136-.21-.238-.23-.355a13.317 13.317 0 01-.168-1.422c-.394-7.367-1.832-14.465-4.87-21.246-1.786-3.988-3.758-8.07-1.915-12.832-1.246.66-2.375 1.313-3.183 2.246-2.41 2.785-3.407 6.13-3.664 9.793-.22 3.13-.52 6.274-1.102 9.352-.61 3.234-1.574 6.402-3.75 9.375-.875-6.348-.973-12.63-6.633-16.66zM92 86.75H35.016v9.898H92zm-45.684 15.016c-.046 8.242 8.348 14.382 18.723 13.937 8.602-.371 16.211-7.137 15.559-13.937zm0 0" fill="#e75225"/></svg>
  <text x="368" y="44" font-size="12" font-weight="600" fill="#c2410c" text-anchor="middle">Prometheus</text>

  <!-- analysis pills -->
  <rect x="210" y="98" width="72" height="24" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
  <text x="246" y="114" font-size="9.5" fill="#a16207" text-anchor="middle">AnalysisRun</text>
  <rect x="380" y="98" width="72" height="24" rx="12" fill="#fefce8" stroke="#fde047" stroke-width="1.2"/>
  <text x="416" y="114" font-size="9.5" fill="#a16207" text-anchor="middle">AnalysisRun</text>

  <!-- query lines pill -> prometheus -->
  <line x1="262" y1="98" x2="312" y2="61" stroke="#e6522c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#cg)"/>
  <line x1="402" y1="98" x2="388" y2="61" stroke="#e6522c" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#cg)"/>
  <rect x="300" y="78" width="98" height="13" rx="3" fill="#f8f9fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="349" y="85" font-size="8.5" fill="#c2410c" text-anchor="middle" dominant-baseline="central">success-rate, latency</text>

  <!-- pill -> canary box -->
  <line x1="246" y1="122" x2="246" y2="148" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#cg)"/>
  <line x1="416" y1="122" x2="416" y2="148" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#cg)"/>

  <!-- flow boxes -->
  <rect x="20" y="150" width="110" height="56" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="75" y="173" font-size="11" font-weight="600" fill="#374151" text-anchor="middle">Stable v1</text>
  <text x="75" y="190" font-size="9" fill="#6b7280" text-anchor="middle">100% traffic</text>

  <rect x="190" y="150" width="112" height="56" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="246" y="173" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Canary 20%</text>
  <text x="246" y="190" font-size="9" fill="#6b7280" text-anchor="middle">pause + analyse</text>

  <rect x="360" y="150" width="112" height="56" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="416" y="173" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Canary 60%</text>
  <text x="416" y="190" font-size="9" fill="#6b7280" text-anchor="middle">pause + analyse</text>

  <rect x="530" y="150" width="110" height="56" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="585" y="173" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">Promote v2</text>
  <text x="585" y="190" font-size="9" fill="#6b7280" text-anchor="middle">100% traffic</text>

  <!-- forward arrows (pass) -->
  <line x1="130" y1="178" x2="188" y2="178" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#cg)"/>
  <line x1="302" y1="178" x2="358" y2="178" stroke="#16a34a" stroke-width="1.5" marker-end="url(#cg-grn)"/>
  <rect x="316" y="170" width="30" height="13" rx="3" fill="#f8f9fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="331" y="177" font-size="8.5" fill="#16a34a" text-anchor="middle" dominant-baseline="central">pass</text>
  <line x1="472" y1="178" x2="528" y2="178" stroke="#16a34a" stroke-width="1.5" marker-end="url(#cg-grn)"/>
  <rect x="486" y="170" width="30" height="13" rx="3" fill="#f8f9fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="501" y="177" font-size="8.5" fill="#16a34a" text-anchor="middle" dominant-baseline="central">pass</text>

  <!-- rollback arc (fail) -->
  <path d="M416,206 C416,275 130,275 75,208"
        fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#cg-red)"/>
  <rect x="178" y="270" width="240" height="15" rx="4" fill="#f8f9fa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="298" y="278" font-size="9.5" fill="#dc2626" text-anchor="middle" dominant-baseline="central">analysis fails → abort &amp; roll back to v1</text>

  </g>
</svg>
