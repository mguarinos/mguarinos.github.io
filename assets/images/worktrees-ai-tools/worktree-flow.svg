<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#adb5bd"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#fa5252"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#f8f9fa"/>

  <!-- Step boxes: y=60, height=64, width=130 -->
  <!-- positions: 30, 195, 360, 525, 695 -->

  <!-- ── 1: create ── -->
  <rect x="30" y="60" width="135" height="64" rx="6"
        fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="97" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#212529">create</text>
  <text x="97" y="101" text-anchor="middle" font-size="10" fill="#adb5bd" font-family="monospace">git worktree add</text>
  <text x="97" y="116" text-anchor="middle" font-size="10" fill="#adb5bd">new branch + dir</text>
  <!-- Arrow 1 → 2 -->
  <line x1="165" y1="92" x2="193" y2="92"
        stroke="#ced4da" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── 2: agent session (blue) ── -->
  <rect x="195" y="60" width="135" height="64" rx="6"
        fill="#e7f5ff" stroke="#339af0" stroke-width="1.5"/>
  <text x="262" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#1971c2">agent session</text>
  <text x="262" y="101" text-anchor="middle" font-size="10" fill="#339af0" font-family="monospace">claude / opencode</text>
  <text x="262" y="116" text-anchor="middle" font-size="10" fill="#1c7ed6">edits · commits · tests</text>
  <!-- Arrow 2 → 3 -->
  <line x1="330" y1="92" x2="358" y2="92"
        stroke="#ced4da" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── 3: review ── -->
  <rect x="360" y="60" width="135" height="64" rx="6"
        fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="427" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#212529">review</text>
  <text x="427" y="101" text-anchor="middle" font-size="10" fill="#adb5bd" font-family="monospace">git diff · tests</text>
  <text x="427" y="116" text-anchor="middle" font-size="10" fill="#adb5bd">open PR</text>
  <!-- Arrow 3 → 4 (accept) -->
  <line x1="495" y1="92" x2="523" y2="92"
        stroke="#ced4da" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="509" y="85" text-anchor="middle" font-size="9" fill="#40c057">accept</text>

  <!-- Reject arc: review bottom → cleanup top, arcing below -->
  <path d="M 427 124 C 427 168 757 168 757 124"
        fill="none" stroke="#fa5252" stroke-width="1.2" stroke-dasharray="4,3"
        marker-end="url(#arr-red)"/>
  <text x="592" y="182" text-anchor="middle" font-size="9" fill="#fa5252">reject → remove --force</text>

  <!-- ── 4: merge (green) ── -->
  <rect x="525" y="60" width="135" height="64" rx="6"
        fill="#ebfbee" stroke="#40c057" stroke-width="1.5"/>
  <text x="592" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#2f9e44">merge</text>
  <text x="592" y="101" text-anchor="middle" font-size="10" fill="#40c057" font-family="monospace">PR merged</text>
  <text x="592" y="116" text-anchor="middle" font-size="10" fill="#2f9e44">branch lands on main</text>
  <!-- Arrow 4 → 5 -->
  <line x1="660" y1="92" x2="688" y2="92"
        stroke="#ced4da" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── 5: cleanup ── -->
  <rect x="690" y="60" width="175" height="64" rx="6"
        fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="777" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#212529">cleanup</text>
  <text x="777" y="101" text-anchor="middle" font-size="10" fill="#adb5bd" font-family="monospace">git worktree remove</text>
  <text x="777" y="116" text-anchor="middle" font-size="10" fill="#adb5bd">dir gone · ref pruned</text>

</svg>
