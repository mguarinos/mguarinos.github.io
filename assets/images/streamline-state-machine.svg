<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 256" width="800" height="256">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#cccccc"/>
    </marker>
    <marker id="a-live" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#e63946"/>
    </marker>
    <marker id="a-idle" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#4da6ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="256" fill="#111111"/>

  <!-- Initial state dot + arrow -->
  <circle cx="32" cy="128" r="8" fill="#cccccc"/>
  <line x1="40" y1="128" x2="68" y2="128"
        stroke="#cccccc" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- idle state -->
  <rect x="70" y="98" width="160" height="60" rx="30"
        fill="#1a1a1a" stroke="#4da6ff" stroke-width="2"/>
  <text x="150" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" font-weight="600" fill="#cccccc" text-anchor="middle">idle</text>
  <text x="150" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="10" fill="#555555" text-anchor="middle">player shows offline</text>

  <!-- live state -->
  <rect x="570" y="98" width="160" height="60" rx="30"
        fill="#1a1a1a" stroke="#e63946" stroke-width="2"/>
  <text x="650" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" font-weight="600" fill="#cccccc" text-anchor="middle">live</text>
  <text x="650" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="10" fill="#555555" text-anchor="middle">DVR window active</text>

  <!-- Upper arc: idle → live  (peaks at y ≈ 50, text sits above at y=14/30) -->
  <path d="M 230,115 C 350,28 450,28 570,115"
        fill="none" stroke="#e63946" stroke-width="1.5" marker-end="url(#a-live)"/>
  <text x="400" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11" font-weight="600" fill="#e63946" text-anchor="middle">IVS Stream Start</text>
  <text x="400" y="32" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="10" fill="#666666" text-anchor="middle">EventBridge → Lambda → SSM  {status: live}</text>

  <!-- Lower arc: live → idle  (peaks at y ≈ 206, text sits below at y=224/240) -->
  <path d="M 570,141 C 450,228 350,228 230,141"
        fill="none" stroke="#4da6ff" stroke-width="1.5" marker-end="url(#a-idle)"/>
  <text x="400" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11" font-weight="600" fill="#4da6ff" text-anchor="middle">IVS Stream End / Failure</text>
  <text x="400" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="10" fill="#666666" text-anchor="middle">EventBridge → Lambda → SSM  {status: idle}</text>
</svg>
