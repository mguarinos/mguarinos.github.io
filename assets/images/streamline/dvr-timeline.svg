<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.6"/>
      <stop offset="82%" style="stop-color:#e63946"/>
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" rx="8" fill="#111111"/>

  <!-- Title -->
  <text x="400" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="14" fill="#888888" text-anchor="middle">DVR window — 4 hours seekable while the stream is live</text>

  <!-- Timeline track (full 4h range) -->
  <rect x="60" y="100" width="680" height="6" rx="3" fill="#2a2a2a"/>

  <!-- Played / buffered portion -->
  <rect x="60" y="100" width="556" height="6" rx="3" fill="url(#bar)"/>

  <!-- Scrubber at current position (viewer rewound 45min) -->
  <circle cx="556" cy="103" r="10" fill="#ffffff" stroke="#e63946" stroke-width="2"/>

  <!-- Current position label -->
  <text x="556" y="85" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle">−45 min</text>

  <!-- Live edge marker -->
  <rect x="736" y="92" width="1" height="22" stroke="#e63946" stroke-width="1.5" fill="#e63946"/>
  <rect x="715" y="75" width="45" height="20" rx="3" fill="#e63946"/>
  <text x="737" y="88" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">LIVE</text>

  <!-- Start marker -->
  <text x="60" y="130" font-family="monospace" font-size="11" fill="#555555" text-anchor="middle">−4h</text>
  <text x="230" y="130" font-family="monospace" font-size="11" fill="#555555" text-anchor="middle">−3h</text>
  <text x="400" y="130" font-family="monospace" font-size="11" fill="#555555" text-anchor="middle">−2h</text>
  <text x="570" y="130" font-family="monospace" font-size="11" fill="#555555" text-anchor="middle">−1h</text>
  <text x="738" y="130" font-family="monospace" font-size="11" fill="#e63946" text-anchor="middle">now</text>

  <!-- Tick marks -->
  <g stroke="#333333" stroke-width="1">
    <line x1="230" y1="98" x2="230" y2="110"/>
    <line x1="400" y1="98" x2="400" y2="110"/>
    <line x1="570" y1="98" x2="570" y2="110"/>
  </g>

  <!-- Caption -->
  <text x="400" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="12" fill="#555555" text-anchor="middle">
    Drag the scrubber to rewind. Click LIVE to snap back to the live edge.
  </text>
</svg>
