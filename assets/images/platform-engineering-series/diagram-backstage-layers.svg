<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">

  <rect width="700" height="200" fill="#f8f9fa"/>

  <!-- Layer 1: Your App (top, green) -->
  <rect x="35" y="12" width="630" height="52" rx="8" fill="#ebfbee" stroke="#40c057" stroke-width="1.5"/>
  <text x="60" y="33" font-size="12" font-weight="600" fill="#2f9e44">Your App</text>
  <text x="60" y="50" font-size="9" fill="#2f9e44" font-family="monospace">app-config.yaml · branding · which plugins to load · custom pages</text>
  <text x="615" y="42" text-anchor="end" font-size="9" fill="#40c057" font-style="italic">you own this</text>

  <!-- Layer 2: Plugins (middle, blue) -->
  <rect x="35" y="77" width="630" height="52" rx="8" fill="#e7f5ff" stroke="#339af0" stroke-width="1.5"/>
  <text x="60" y="98" font-size="12" font-weight="600" fill="#1971c2">Plugins</text>
  <text x="60" y="115" font-size="9" fill="#1c7ed6" font-family="monospace">catalog · scaffolder · techdocs · github-actions · kubernetes · ...</text>
  <text x="615" y="107" text-anchor="end" font-size="9" fill="#339af0" font-style="italic">npm packages</text>

  <!-- Layer 3: Core (bottom, grey) -->
  <rect x="35" y="142" width="630" height="52" rx="8" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="60" y="163" font-size="12" font-weight="600" fill="#495057">Core</text>
  <text x="60" y="180" font-size="9" fill="#868e96" font-family="monospace">plugin framework · routing · authentication · catalog engine</text>
  <text x="615" y="172" text-anchor="end" font-size="9" fill="#adb5bd" font-style="italic">maintained by CNCF</text>

  <!-- Bracket on the left showing "builds on" -->
  <line x1="24" y1="38"  x2="18" y2="38"  stroke="#ced4da" stroke-width="1.2"/>
  <line x1="18" y1="38"  x2="18" y2="168" stroke="#ced4da" stroke-width="1.2"/>
  <line x1="18" y1="168" x2="24" y2="168" stroke="#ced4da" stroke-width="1.2"/>
  <text x="5" y="110" text-anchor="middle" font-size="9" fill="#adb5bd" transform="rotate(-90,5,110)">builds on</text>

</svg>
