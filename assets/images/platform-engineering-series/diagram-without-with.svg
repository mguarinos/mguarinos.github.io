<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 265" width="900" height="265"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">

  <defs>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#40c057"/>
    </marker>
  </defs>

  <rect width="900" height="265" fill="#f8f9fa"/>

  <!-- Divider -->
  <line x1="450" y1="12" x2="450" y2="253" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- === LEFT: Without === -->
  <text x="215" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#868e96">Without a golden path</text>

  <!-- Team A – orange border, inconsistent -->
  <rect x="25" y="40" width="170" height="68" rx="6" fill="#fff" stroke="#fab005" stroke-width="2"/>
  <text x="110" y="61" text-anchor="middle" font-size="11" font-weight="600" fill="#212529">Team A</text>
  <text x="110" y="78" text-anchor="middle" font-size="9" fill="#adb5bd" font-family="monospace">custom deploy.sh</text>
  <text x="110" y="95" text-anchor="middle" font-size="9" fill="#adb5bd" font-family="monospace">no branch protection</text>

  <!-- Team B – red dashed, different style -->
  <rect x="200" y="128" width="170" height="68" rx="6" fill="#fff" stroke="#e03131" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="285" y="149" text-anchor="middle" font-size="11" font-weight="600" fill="#212529">Team B</text>
  <text x="285" y="166" text-anchor="middle" font-size="9" fill="#adb5bd" font-family="monospace">Makefile + bash</text>
  <text x="285" y="183" text-anchor="middle" font-size="9" fill="#adb5bd" font-family="monospace">no runbook</text>

  <!-- Team C – grey, just copied from A -->
  <rect x="30" y="210" width="170" height="44" rx="6" fill="#fff" stroke="#ced4da" stroke-width="1.5"/>
  <text x="115" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#212529">Team C</text>
  <text x="115" y="246" text-anchor="middle" font-size="9" fill="#adb5bd" font-family="monospace">copied from Team A</text>

  <!-- === RIGHT: With === -->
  <text x="678" y="26" text-anchor="middle" font-size="12" font-weight="600" fill="#2f9e44">With a golden path</text>

  <!-- Template -->
  <rect x="578" y="40" width="200" height="52" rx="6" fill="#ebfbee" stroke="#40c057" stroke-width="1.5"/>
  <text x="678" y="61" text-anchor="middle" font-size="11" font-weight="600" fill="#2f9e44">Software Template</text>
  <text x="678" y="78" text-anchor="middle" font-size="9" fill="#40c057" font-family="monospace">CI · Docker · catalog · runbook</text>

  <!-- Fan arrows to service boxes -->
  <line x1="628" y1="92" x2="540" y2="145" stroke="#40c057" stroke-width="1.2" marker-end="url(#arr-g)"/>
  <line x1="678" y1="92" x2="678" y2="145" stroke="#40c057" stroke-width="1.2" marker-end="url(#arr-g)"/>
  <line x1="728" y1="92" x2="816" y2="145" stroke="#40c057" stroke-width="1.2" marker-end="url(#arr-g)"/>

  <!-- Three identical boxes -->
  <rect x="473" y="147" width="130" height="50" rx="6" fill="#fff" stroke="#40c057" stroke-width="1.5"/>
  <text x="538" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#212529">Team A</text>
  <text x="538" y="184" text-anchor="middle" font-size="9" fill="#40c057" font-family="monospace">golden path ✓</text>

  <rect x="613" y="147" width="130" height="50" rx="6" fill="#fff" stroke="#40c057" stroke-width="1.5"/>
  <text x="678" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#212529">Team B</text>
  <text x="678" y="184" text-anchor="middle" font-size="9" fill="#40c057" font-family="monospace">golden path ✓</text>

  <rect x="753" y="147" width="130" height="50" rx="6" fill="#fff" stroke="#40c057" stroke-width="1.5"/>
  <text x="818" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#212529">Team C</text>
  <text x="818" y="184" text-anchor="middle" font-size="9" fill="#40c057" font-family="monospace">golden path ✓</text>

  <!-- Bottom captions -->
  <text x="215" y="258" text-anchor="middle" font-size="10" fill="#adb5bd">every team reinvents the wheel</text>
  <text x="678" y="218" text-anchor="middle" font-size="10" fill="#adb5bd">encode once · apply everywhere</text>

</svg>
