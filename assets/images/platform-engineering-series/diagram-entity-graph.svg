  <line x1="615" y1="222" x2="590" y2="266" stroke="#ced4da" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="687" y1="222" x2="760" y2="266" stroke="#ced4da" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="118" y="247" text-anchor="middle" font-size="8" fill="#adb5bd">dependsOn</text>
  <text x="560" y="247" text-anchor="middle" font-size="8" fill="#adb5bd">dependsOn</text>
  <text x="745" y="247" text-anchor="middle" font-size="8" fill="#adb5bd">providesApis</text>

  <!-- Row 4: Resources + API -->
  <rect x="45" y="268" width="180" height="35" rx="6" fill="#fff" stroke="#ced4da" stroke-width="1.5"/>
