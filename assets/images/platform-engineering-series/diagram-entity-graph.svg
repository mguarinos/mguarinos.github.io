  <text x="87" y="199" font-size="10" fill="#1c7ed6">Component</text>
  <text x="162" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#1971c2">orders-service</text>

  <rect x="280" y="184" width="195" height="38" rx="6" fill="#e7f5ff" stroke="#339af0" stroke-width="1.5"/>
  <text x="302" y="199" font-size="10" fill="#1c7ed6">Component</text>
  <text x="377" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#1971c2">cart-service</text>

  <rect x="554" y="184" width="195" height="38" rx="6" fill="#e7f5ff" stroke="#339af0" stroke-width="1.5"/>
  <text x="576" y="199" font-size="10" fill="#1c7ed6">Component</text>
  <text x="651" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#1971c2">payments-service</text>

