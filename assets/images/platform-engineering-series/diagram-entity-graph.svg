<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 308" width="900" height="308"
     font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#adb5bd"/>
    </marker>
  </defs>

  <rect width="900" height="308" fill="#f8f9fa"/>

  <!-- Row 1: Domain -->
  <rect x="300" y="14" width="300" height="38" rx="6" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="340" y="29" font-size="10" fill="#868e96">Domain</text>
  <text x="450" y="38" text-anchor="middle" font-size="12" font-weight="600" fill="#495057">e-commerce</text>

  <!-- Domain → Systems arrows -->
  <line x1="390" y1="52" x2="248" y2="97" stroke="#ced4da" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="510" y1="52" x2="652" y2="97" stroke="#ced4da" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="295" y="76" text-anchor="middle" font-size="8" fill="#adb5bd">contains</text>
  <text x="605" y="76" text-anchor="middle" font-size="8" fill="#adb5bd">contains</text>

