  <text x="135" y="291" text-anchor="middle" font-size="11" font-weight="600" fill="#495057">orders-db</text>

  <rect x="490" y="268" width="195" height="35" rx="6" fill="#fff" stroke="#ced4da" stroke-width="1.5"/>
  <text x="512" y="282" font-size="10" fill="#868e96">Resource</text>
  <text x="587" y="291" text-anchor="middle" font-size="11" font-weight="600" fill="#495057">payments-db</text>

  <rect x="700" y="268" width="155" height="35" rx="6" fill="#fff" stroke="#748ffc" stroke-width="1.5"/>
  <text x="722" y="282" font-size="10" fill="#748ffc">API</text>
  <text x="777" y="291" text-anchor="middle" font-size="11" font-weight="600" fill="#495057">payments-api</text>

