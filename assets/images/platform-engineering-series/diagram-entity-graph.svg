  <text x="248" y="123" text-anchor="middle" font-size="12" font-weight="600" fill="#212529">checkout-platform</text>

  <rect x="517" y="99" width="270" height="38" rx="6" fill="#fff" stroke="#ced4da" stroke-width="1.5"/>
  <text x="539" y="114" font-size="10" fill="#868e96">System</text>
  <text x="652" y="123" text-anchor="middle" font-size="12" font-weight="600" fill="#212529">payments-platform</text>

  <!-- Systems → Components arrows -->
  <line x1="200" y1="137" x2="163" y2="182" stroke="#ced4da" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="296" y1="137" x2="333" y2="182" stroke="#ced4da" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="652" y1="137" x2="652" y2="182" stroke="#ced4da" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="156" y="163" text-anchor="middle" font-size="8" fill="#adb5bd">contains</text>
  <text x="340" y="163" text-anchor="middle" font-size="8" fill="#adb5bd">contains</text>
  <text x="668" y="163" text-anchor="middle" font-size="8" fill="#adb5bd">contains</text>

