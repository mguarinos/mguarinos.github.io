<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900" height="506">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f1"/>
      <stop offset="100%" stop-color="#fef3e2"/>
    </linearGradient>
    <radialGradient id="bloom" cx="20%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#f46800" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#f46800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vdiv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f46800" stop-opacity="0"/>
      <stop offset="20%" stop-color="#f46800" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#f46800" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f46800" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#f46800" opacity="0.08"/>
    </pattern>
    <filter id="cs" x="-5%" y="-15%" width="110%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="900" height="506" fill="url(#bg)"/>
