<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 178">
  <style>text { font-family: Inter, system-ui, sans-serif; }</style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#9ca3af"/>
    </marker>
    <marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#c4b5fd"/>
    </marker>
  </defs>

  <!-- ── Services ── -->
  <rect x="8" y="44" width="112" height="90" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="64" y="68"  font-size="12" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="central">services</text>
  <text x="64" y="86"  font-size="10" fill="#6b7280" text-anchor="middle" dominant-baseline="central">order · inventory</text>
  <text x="64" y="100" font-size="10" fill="#6b7280" text-anchor="middle" dominant-baseline="central">payment · notif.</text>
  <text x="64" y="117" font-size="9"  fill="#9ca3af" text-anchor="middle" dominant-baseline="central" font-style="italic">JSON → stdout</text>

  <!-- Arrow 1: Services → Promtail -->
  <line x1="120" y1="89" x2="162" y2="89" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="115" y="69" width="52" height="30" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="141" y="80" font-size="9" fill="#6b7280" text-anchor="middle" dominant-baseline="central">Docker</text>
  <text x="141" y="92" font-size="9" fill="#6b7280" text-anchor="middle" dominant-baseline="central">logs</text>

  <!-- ── Promtail ── -->
  <rect x="162" y="56" width="118" height="66" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="221" y="76"  font-size="12" font-weight="600" fill="#374151" text-anchor="middle" dominant-baseline="central">Promtail</text>
  <text x="221" y="92"  font-size="10" fill="#6b7280" text-anchor="middle" dominant-baseline="central">Docker SD</text>
  <text x="221" y="106" font-size="10" fill="#6b7280" text-anchor="middle" dominant-baseline="central">+ relabelling</text>

  <!-- Arrow 2: Promtail → Loki -->
  <line x1="280" y1="89" x2="322" y2="89" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="275" y="69" width="52" height="30" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="301" y="80" font-size="9" fill="#6b7280" text-anchor="middle" dominant-baseline="central">HTTP</text>
  <text x="301" y="92" font-size="9" fill="#6b7280" text-anchor="middle" dominant-baseline="central">push</text>

  <!-- ── Loki ── -->
  <rect x="322" y="56" width="110" height="66" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="377" y="76"  font-size="12" font-weight="600" fill="#374151" text-anchor="middle" dominant-baseline="central">Loki</text>
  <text x="377" y="92"  font-size="10" fill="#6b7280" text-anchor="middle" dominant-baseline="central">label index</text>
  <text x="377" y="106" font-size="10" fill="#6b7280" text-anchor="middle" dominant-baseline="central">+ chunks</text>

  <!-- Arrow 3: Loki → Grafana -->
  <line x1="432" y1="89" x2="474" y2="89" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="427" y="75" width="52" height="18" rx="4" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="453" y="84" font-size="9" fill="#6b7280" text-anchor="middle" dominant-baseline="central">LogQL</text>

  <!-- ── Grafana ── -->
  <rect x="474" y="56" width="118" height="66" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="533" y="76"  font-size="12" font-weight="600" fill="#374151" text-anchor="middle" dominant-baseline="central">Grafana</text>
  <text x="533" y="92"  font-size="10" fill="#6b7280" text-anchor="middle" dominant-baseline="central">Explore</text>
  <text x="533" y="106" font-size="10" fill="#6b7280" text-anchor="middle" dominant-baseline="central">Logs panel</text>

  <!-- Arrow 4: Grafana → Tempo (dashed, optional jump) -->
  <line x1="592" y1="89" x2="634" y2="89" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#b)"/>
  <rect x="587" y="69" width="52" height="30" rx="4" fill="white" stroke="#ede9fe" stroke-width="1"/>
  <text x="613" y="80" font-size="9" fill="#7c3aed" text-anchor="middle" dominant-baseline="central">trace_id</text>
  <text x="613" y="92" font-size="9" fill="#7c3aed" text-anchor="middle" dominant-baseline="central">link</text>

  <!-- ── Tempo ── -->
  <rect x="634" y="56" width="78" height="66" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="673" y="76"  font-size="12" font-weight="600" fill="#374151" text-anchor="middle" dominant-baseline="central">Tempo</text>
  <text x="673" y="92"  font-size="10" fill="#6b7280" text-anchor="middle" dominant-baseline="central">traces</text>
  <text x="673" y="106" font-size="10" fill="#7c3aed" text-anchor="middle" dominant-baseline="central">optional</text>

  <!-- Legend: dashed = optional jump -->
  <line x1="8" y1="158" x2="28" y2="158" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="34" y="158" font-size="9" fill="#9ca3af" dominant-baseline="central">jump to trace (optional, requires Tempo)</text>
</svg>
