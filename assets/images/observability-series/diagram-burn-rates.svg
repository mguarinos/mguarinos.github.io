<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 268">
  <style>text { font-family: Inter, system-ui, sans-serif; }</style>

  <!-- horizontal grid lines at 75%, 50%, 25% -->
  <line x1="52" y1="71"  x2="524" y2="71"  stroke="#f3f4f6" stroke-width="1"/>
  <line x1="52" y1="122" x2="524" y2="122" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="52" y1="173" x2="524" y2="173" stroke="#f3f4f6" stroke-width="1"/>

  <!-- vertical grid lines at 5d intervals -->
  <line x1="131" y1="20" x2="131" y2="224" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="209" y1="20" x2="209" y2="224" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="288" y1="20" x2="288" y2="224" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="367" y1="20" x2="367" y2="224" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="445" y1="20" x2="445" y2="224" stroke="#f3f4f6" stroke-width="1"/>

  <!-- axes -->
  <line x1="52" y1="224" x2="524" y2="224" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="52" y1="20"  x2="52"  y2="224" stroke="#d1d5db" stroke-width="1.5"/>

  <!-- y-axis ticks -->
  <line x1="48" y1="20"  x2="52" y2="20"  stroke="#d1d5db" stroke-width="1"/>
  <line x1="48" y1="71"  x2="52" y2="71"  stroke="#d1d5db" stroke-width="1"/>
  <line x1="48" y1="122" x2="52" y2="122" stroke="#d1d5db" stroke-width="1"/>
  <line x1="48" y1="173" x2="52" y2="173" stroke="#d1d5db" stroke-width="1"/>
  <line x1="48" y1="224" x2="52" y2="224" stroke="#d1d5db" stroke-width="1"/>

  <!-- y-axis labels -->
  <text x="44" y="20"  font-size="10" fill="#9ca3af" text-anchor="end" dominant-baseline="central">100%</text>
  <text x="44" y="71"  font-size="10" fill="#9ca3af" text-anchor="end" dominant-baseline="central">75%</text>
  <text x="44" y="122" font-size="10" fill="#9ca3af" text-anchor="end" dominant-baseline="central">50%</text>
  <text x="44" y="173" font-size="10" fill="#9ca3af" text-anchor="end" dominant-baseline="central">25%</text>
  <text x="44" y="224" font-size="10" fill="#9ca3af" text-anchor="end" dominant-baseline="central">0%</text>

  <!-- y-axis title -->
  <text transform="rotate(-90) translate(-122, 14)" font-size="10" fill="#9ca3af" text-anchor="middle">budget remaining</text>

  <!-- x-axis ticks -->
  <line x1="52"  y1="224" x2="52"  y2="228" stroke="#d1d5db" stroke-width="1"/>
  <line x1="131" y1="224" x2="131" y2="228" stroke="#d1d5db" stroke-width="1"/>
  <line x1="209" y1="224" x2="209" y2="228" stroke="#d1d5db" stroke-width="1"/>
  <line x1="288" y1="224" x2="288" y2="228" stroke="#d1d5db" stroke-width="1"/>
  <line x1="367" y1="224" x2="367" y2="228" stroke="#d1d5db" stroke-width="1"/>
  <line x1="445" y1="224" x2="445" y2="228" stroke="#d1d5db" stroke-width="1"/>
  <line x1="524" y1="224" x2="524" y2="228" stroke="#d1d5db" stroke-width="1"/>

  <!-- x-axis labels -->
  <text x="52"  y="238" font-size="10" fill="#9ca3af" text-anchor="middle">0</text>
  <text x="131" y="238" font-size="10" fill="#9ca3af" text-anchor="middle">5</text>
  <text x="209" y="238" font-size="10" fill="#9ca3af" text-anchor="middle">10</text>
  <text x="288" y="238" font-size="10" fill="#9ca3af" text-anchor="middle">15</text>
  <text x="367" y="238" font-size="10" fill="#9ca3af" text-anchor="middle">20</text>
  <text x="445" y="238" font-size="10" fill="#9ca3af" text-anchor="middle">25</text>
  <text x="524" y="238" font-size="10" fill="#9ca3af" text-anchor="middle">30</text>
  <text x="288" y="256" font-size="10" fill="#9ca3af" text-anchor="middle">days</text>

  <!-- burn rate lines: draw least steep first so steeper lines render on top -->

  <!-- 1× — amber dashed: (52,20) → (524,224) -->
  <line x1="52" y1="20" x2="524" y2="224" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>

  <!-- 3× — amber solid: exhausts at day 10 → x=209 -->
  <line x1="52" y1="20" x2="209" y2="224" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- 6× — red dashed: exhausts at day 5 → x=131 -->
  <line x1="52" y1="20" x2="131" y2="224" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- 14.4× — red solid: exhausts at day ~2.1 → x=85 -->
  <line x1="52" y1="20" x2="85"  y2="224" stroke="#ef4444" stroke-width="2.5"/>

  <!-- common start dot at 100% budget, day 0 -->
  <circle cx="52" cy="20" r="3" fill="white" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- exhaustion dots -->
  <circle cx="85"  cy="224" r="3.5" fill="#ef4444"/>
  <circle cx="131" cy="224" r="3.5" fill="#ef4444"/>
  <circle cx="209" cy="224" r="3.5" fill="#f59e0b"/>
  <circle cx="524" cy="224" r="3.5" fill="#f59e0b"/>

  <!-- line labels near exhaustion points (white bg for readability) -->
  <rect x="65"  y="202" width="40" height="14" fill="white" fill-opacity="0.9"/>
  <text x="85"  y="209" font-size="10" fill="#ef4444" font-weight="600" text-anchor="middle" dominant-baseline="central">14.4×</text>

  <rect x="122" y="202" width="20" height="14" fill="white" fill-opacity="0.9"/>
  <text x="132" y="209" font-size="10" fill="#ef4444" font-weight="600" text-anchor="middle" dominant-baseline="central">6×</text>

  <rect x="200" y="202" width="20" height="14" fill="white" fill-opacity="0.9"/>
  <text x="210" y="209" font-size="10" fill="#f59e0b" font-weight="600" text-anchor="middle" dominant-baseline="central">3×</text>

  <!-- 1× label along the line at day 22 (budget ~27%, x≈398, y≈170) -->
  <rect x="391" y="158" width="18" height="14" fill="white" fill-opacity="0.9"/>
  <text x="400" y="165" font-size="10" fill="#f59e0b" font-weight="600" text-anchor="middle" dominant-baseline="central">1×</text>

  <!-- legend -->
  <rect x="290" y="26" width="170" height="62" rx="3" fill="white" fill-opacity="0.92" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="300" y1="40" x2="318" y2="40" stroke="#ef4444" stroke-width="2.5"/>
  <text x="324" y="40" font-size="10" fill="#374151" dominant-baseline="central">14.4× — page (critical)</text>
  <line x1="300" y1="54" x2="318" y2="54" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="324" y="54" font-size="10" fill="#374151" dominant-baseline="central">6× — page (critical)</text>
  <line x1="300" y1="68" x2="318" y2="68" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="324" y="68" font-size="10" fill="#374151" dominant-baseline="central">3× — ticket (warning)</text>
  <line x1="300" y1="82" x2="318" y2="82" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="324" y="82" font-size="10" fill="#374151" dominant-baseline="central">1× — ticket (warning)</text>
</svg>
