<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="'SF Mono', 'Fira Code', monospace">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
  </defs>
  <rect width="860" height="320" fill="#0d1117" rx="8"/>

  <!-- Step boxes -->
  <!-- 1: Workflow trigger -->
  <rect x="20" y="110" width="140" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="90" y="134" text-anchor="middle" fill="#8b949e" font-size="9" letter-spacing="1">WORKFLOW</text>
  <text x="90" y="154" text-anchor="middle" fill="#c9d1d9" font-size="11">push to main</text>
  <text x="90" y="173" text-anchor="middle" fill="#8b949e" font-size="9">id-token: write</text>
  <text x="90" y="192" text-anchor="middle" fill="#58a6ff" font-size="9">permissions granted</text>

  <!-- 2: GitHub OIDC endpoint -->
  <rect x="200" y="90" width="150" height="140" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="275" y="114" text-anchor="middle" fill="#8b949e" font-size="9" letter-spacing="1">GITHUB OIDC</text>
  <text x="275" y="133" text-anchor="middle" fill="#c9d1d9" font-size="10">issues JWT</text>
  <line x1="215" y1="143" x2="335" y2="143" stroke="#30363d" stroke-width="1"/>
  <text x="275" y="160" text-anchor="middle" fill="#8b949e" font-size="8">sub: repo:org/repo:</text>
  <text x="275" y="174" text-anchor="middle" fill="#8b949e" font-size="8">ref:refs/heads/main</text>
  <text x="275" y="190" text-anchor="middle" fill="#8b949e" font-size="8">aud: sts.amazonaws.com</text>
  <text x="275" y="206" text-anchor="middle" fill="#3fb950" font-size="8">exp: now + 5min</text>

  <!-- 3: AWS STS -->
  <rect x="390" y="90" width="150" height="140" rx="6" fill="#161b22" stroke="#ff9900" stroke-width="1.5"/>
  <text x="465" y="114" text-anchor="middle" fill="#8b949e" font-size="9" letter-spacing="1">AWS STS</text>
  <text x="465" y="133" text-anchor="middle" fill="#c9d1d9" font-size="10">validates JWT</text>
  <line x1="405" y1="143" x2="525" y2="143" stroke="#30363d" stroke-width="1"/>
  <text x="465" y="160" text-anchor="middle" fill="#8b949e" font-size="8">1. verify signature</text>
  <text x="465" y="175" text-anchor="middle" fill="#8b949e" font-size="8">2. check trust policy</text>
  <text x="465" y="190" text-anchor="middle" fill="#8b949e" font-size="8">3. match sub condition</text>
  <text x="465" y="206" text-anchor="middle" fill="#ff9900" font-size="8">AssumeRoleWithWebIdentity</text>

  <!-- 4: IAM Role -->
  <rect x="580" y="90" width="150" height="140" rx="6" fill="#161b22" stroke="#ff9900" stroke-width="1.5"/>
  <text x="655" y="114" text-anchor="middle" fill="#8b949e" font-size="9" letter-spacing="1">IAM ROLE</text>
  <text x="655" y="133" text-anchor="middle" fill="#c9d1d9" font-size="10">trust policy</text>
  <line x1="595" y1="143" x2="715" y2="143" stroke="#30363d" stroke-width="1"/>
  <text x="655" y="160" text-anchor="middle" fill="#8b949e" font-size="8">Principal:</text>
  <text x="655" y="175" text-anchor="middle" fill="#8b949e" font-size="8">oidc-provider/token</text>
  <text x="655" y="190" text-anchor="middle" fill="#8b949e" font-size="8">.actions.github.com</text>
  <text x="655" y="206" text-anchor="middle" fill="#3fb950" font-size="8">sub matches → allow</text>

  <!-- 5: Temp credentials -->
  <rect x="770" y="110" width="70" height="100" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="805" y="134" text-anchor="middle" fill="#8b949e" font-size="8">TEMP</text>
  <text x="805" y="149" text-anchor="middle" fill="#c9d1d9" font-size="9">creds</text>
  <text x="805" y="168" text-anchor="middle" fill="#3fb950" font-size="8">1 hour</text>
  <text x="805" y="183" text-anchor="middle" fill="#3fb950" font-size="8">TTL</text>
  <text x="805" y="198" text-anchor="middle" fill="#8b949e" font-size="7">auto-expire</text>

  <!-- Arrows -->
  <line x1="160" y1="160" x2="198" y2="160" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="160" x2="388" y2="160" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="160" x2="578" y2="160" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="730" y1="160" x2="768" y2="160" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr2)"/>

  <!-- Step numbers -->
  <circle cx="182" cy="80" r="10" fill="#58a6ff" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
  <text x="182" y="84" text-anchor="middle" fill="#58a6ff" font-size="10">1</text>
  <circle cx="372" cy="80" r="10" fill="#58a6ff" opacity="0.2" stroke="#58a6ff" stroke-width="1"/>
  <text x="372" y="84" text-anchor="middle" fill="#58a6ff" font-size="10">2</text>
  <circle cx="562" cy="80" r="10" fill="#ff9900" opacity="0.2" stroke="#ff9900" stroke-width="1"/>
  <text x="562" y="84" text-anchor="middle" fill="#ff9900" font-size="10">3</text>
  <circle cx="752" cy="80" r="10" fill="#3fb950" opacity="0.2" stroke="#3fb950" stroke-width="1"/>
  <text x="752" y="84" text-anchor="middle" fill="#3fb950" font-size="10">4</text>

  <!-- Bottom labels -->
  <text x="430" y="270" text-anchor="middle" fill="#8b949e" font-size="10">Token exchange completes in ~200ms. No secrets stored anywhere.</text>
  <text x="430" y="290" text-anchor="middle" fill="#8b949e" font-size="10">Every exchange is recorded in CloudTrail with the full JWT subject claim.</text>
</svg>
