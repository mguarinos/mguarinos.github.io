<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-copy">&copy; {{ 'now' | date: '%Y' }} {{ site.author | escape }}</p>
    <div class="footer-links">
      {%- if site.social.github -%}
        <a href="https://github.com/{{ site.social.github | escape }}" rel="noopener" target="_blank">GitHub</a>
      {%- endif -%}
      {%- if site.social.linkedin -%}
        <a href="https://linkedin.com/in/{{ site.social.linkedin | escape }}" rel="noopener" target="_blank">LinkedIn</a>
      {%- endif -%}
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </div>
</footer>
