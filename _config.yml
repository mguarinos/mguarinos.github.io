title: Manuel Guarinos
description: Cloud engineering and SRE notes — AWS, serverless, infrastructure.
url: "https://mguarinos.github.io"
baseurl: ""
author: Manuel Guarinos

theme: minima
minima:
  skin: dark
  social_links:
    - { platform: github,    user_url: "https://github.com/mguarinos" }
    - { platform: linkedin,  user_url: "https://www.linkedin.com/in/mguarinos/" }

plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /posts/:year/:month/:day/:title/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
