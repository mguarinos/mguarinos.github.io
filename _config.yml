title: Manuel Guarinos
description: Cloud engineering and SRE notes — AWS, serverless, infrastructure.
url: "https://mguarinos.github.io"
baseurl: ""
author: Manuel Guarinos

theme: minima
minima:
  skin: dark
  social_links:
    github: mguarinos
    linkedin: mguarinos

