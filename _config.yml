title: Manuel Guarinos
description: Writing on cloud engineering and SRE — things that took iterations to get right, and a few that just worked.
url: "https://mguarinos.com"
baseurl: ""
author: Manuel Guarinos

image:
  path: /assets/images/og-default.png
  width: 1920
  height: 1008
  alt: Manuel Guarinos — Cloud Engineering and SRE blog

social:
  github: mguarinos
  linkedin: mguarinos

collections:
  projects:
    output: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-toc
  - jekyll-sitemap

toc:
  min_level: 2
  max_level: 2
  ordered_list: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /posts/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
