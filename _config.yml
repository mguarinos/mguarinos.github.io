title: Manuel Guarinos
description: Writing on cloud engineering and SRE — things that took iterations to get right, and a few that just worked.
url: "https://mguarinos.com"
baseurl: ""
author: Manuel Guarinos

image:
  path: /assets/images/og-default.png
  width: 3840
  height: 2016
  alt: Manuel Guarinos — Cloud Engineering and SRE blog

social:
  github: mguarinos
  linkedin: mguarinos

collections:
  projects:
    output: false
  series:
    output: true
    permalink: /posts/:path/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-toc
  - jekyll-sitemap

toc:
  min_level: 2
  max_level: 2
  ordered_list: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

future: false
livereload: true

permalink: /posts/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_series/observability-series"
      type: series
    values:
      layout: post
      date: "2026-05-01"
      series: "Production Observability"
      categories: [observability, prometheus, grafana, python]
      image: /assets/images/observability-series/header.svg
      github: https://github.com/mguarinos/observability-demo

  - scope:
      path: "_series/ollama-infra-series"
      type: series
    values:
      layout: post
      date: "2026-04-27"
      series: "Self-hosted AI Inference with Ollama"
      categories: [ollama, infra, ai]
      image: /assets/images/ollama-infra-series/header.svg

  - scope:
      path: "_series/platform-engineering-series"
      type: series
    values:
      layout: post
      date: "2026-07-01"
      series: "Building a Golden Path with Backstage"
      categories: [backstage, platform-engineering, devops, developer-experience]
      image: /assets/images/platform-engineering-series/header.svg

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
